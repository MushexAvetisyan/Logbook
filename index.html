<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Airport Flights Logbook</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background"></div>

<header>

    <div class="logo">

        ✈ Airport Flights Logbook

    </div>

    <div class="controls">

        <button id="prevMonth">

            ◀

        </button>

        <h2 id="monthYear"></h2>

        <button id="nextMonth">

            ▶

        </button>

    </div>
    <button id="exportExcel" class="export-btn">

        Export Excel

    </button>

    <button id="exportPdf" class="export-btn">

        Export PDF

    </button>

    <button id="backupJson" class="export-btn">

        Backup JSON

    </button>

    <button id="restoreJson" class="export-btn">

        Restore JSON

    </button>

    <input
            type="file"
            id="restoreFile"
            accept=".json"
            hidden
    >

</header>

<main>

    <div class="calendar">

        <div class="weekdays">

            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
            <div>Sun</div>

        </div>

        <div id="calendarDays" class="days"></div>

    </div>

</main>

<!-- Create Flights Modal -->

<div class="modal" id="createFlightsModal">


    <div class="modal-content create-box">


        <div class="modal-header">


            <h2>Create Daily Flights</h2>


            <span id="closeCreateModal">
&times;
</span>


        </div>



        <div class="create-body">


            <label>
                How many flights today?
            </label>


            <input
                    type="number"
                    id="flightAmount"
                    min="1"
                    placeholder="Example: 12"
            >


            <button
                    id="createFlightsButton"
                    class="add-flight">

                Create Flights

            </button>


        </div>


    </div>


</div>

<!-- Modal -->

<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalDate"></h2>

            <span id="closeModal">&times;</span>

        </div>

        <div id="flightList" class="flight-list"></div>


            <button
                    type="button"
                    id="addFlight"
                    class="add-flight">
                + Add Flight
            </button>
            <button
                    id="createDailyFlights"
                    class="add-flight">
                Create Daily Flights
            </button>

        <form id="flightForm">

            <div class="grid">

                <div class="field">
                    <label>Flight</label>
                    <input type="text" id="flight">
                </div>
                <div class="field">
                    <label>Flight Status</label>

                    <div class="status-buttons">

                        <button type="button" class="status-btn active" data-status="Scheduled">
                            Scheduled
                        </button>

                        <button type="button" class="status-btn" data-status="Boarding">
                            Boarding
                        </button>

                        <button type="button" class="status-btn" data-status="Departed">
                            Departed
                        </button>

                        <button type="button" class="status-btn" data-status="Delayed">
                            Delayed
                        </button>

                        <button type="button" class="status-btn" data-status="Cancelled">
                            Cancelled
                        </button>

                    </div>

                    <input
                            type="hidden"
                            id="status"
                            value="Scheduled"
                    >
                </div>

                <div class="field">
                    <label>A/C</label>
                    <input type="text" id="aircraft">
                </div>

                <div class="field">
                    <label>Captain</label>
                    <input type="text" id="cmd">
                </div>

                <div class="field">
                    <label>Pax</label>
                    <input type="number" id="pax">
                </div>

                <div class="field">
                    <label>No Show</label>
                    <input type="number" id="noshow">
                </div>

                <div class="field">
                    <label>Board</label>
                    <input type="number" id="board">
                </div>

                <div class="field">
                    <label>Bag</label>
                    <input type="text" id="bag">
                </div>

                <div class="field">
                    <label>Delay Code</label>
                    <input type="number" id="delay">
                </div>

                <div class="field">
                    <label>WCHR</label>
                    <input type="number" id="wchr">
                </div>

                <div class="field">
                    <label>Inad</label>
                    <input type="number" id="inad">
                </div>

                <div class="field">
                    <label>Petc</label>
                    <input type="number" id="petc">
                </div>

                <div class="field">
                    <label>Fuel</label>
                    <input type="number" id="fuel">
                </div>

                <div class="field">
                    <label>Fuel Time</label>
                    <input type="text" id="fueltime">
                </div>

                <div class="field">
                    <label>Land</label>
                    <input type="time" id="land">
                </div>

                <div class="field">
                    <label>Chocks</label>
                    <input type="time" id="chocks">
                </div>

                <div class="field">
                    <label>Bag Load</label>
                    <input type="time" id="bagload">
                </div>

                <div class="field">
                    <label>Board</label>
                    <input type="time" id="passboard">
                </div>

                <div class="field">
                    <label>Board End</label>
                    <input type="time" id="passboardend">
                </div>


                <div class="field">
                    <label>Door</label>
                    <input type="time" id="doorclosed">
                </div>

            </div>

            <div class="buttons">

                <button type="submit" class="save">

                    Save

                </button>

                <button type="button" id="deleteData" class="delete">

                    Delete Day

                </button>

                <button
                        type="button"
                        id="deleteFlight"
                        class="delete">

                    Delete Flight

                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable"></script>

</body>
</html>
